name: Build Balatro Multiplayer Server

on:
  schedule:
    # Check once per day
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild of the current upstream commit"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build-server.yml

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: Balatro-Multiplayer/BalatroMultiplayerAPI-Server
  UPSTREAM_BRANCH: main

jobs:
  check-new-release:
    name: Check upstream
    runs-on: ubuntu-latest

    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      upstream_short_sha: ${{ steps.upstream.outputs.short_sha }}
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Determine image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/balatro-multiplayer-server"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE"

      - name: Get latest upstream commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}")

          SHA=$(jq -r '.sha // empty' <<< "$RESPONSE")

          if [[ -z "$SHA" ]]; then
            echo "Failed to determine the latest upstream commit."
            exit 1
          fi

          SHORT_SHA="${SHA:0:12}"

          echo "Latest upstream commit: $SHA"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether build is required
        id: check
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}
          FORCE: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          TAG="sha-${SHORT_SHA}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Local build files changed - rebuilding."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$FORCE" == "true" ]]; then
            echo "Forced rebuild requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "${IMAGE}:${TAG} already exists."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "${IMAGE}:${TAG} does not exist."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish
    needs: check-new-release

    if: needs.check-new-release.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64

          build-args: |
            SERVER_REF=${{ needs.check-new-release.outputs.upstream_sha }}

          tags: |
            ${{ needs.check-new-release.outputs.image }}:sha-${{ needs.check-new-release.outputs.upstream_short_sha }}
            ${{ needs.check-new-release.outputs.image }}:latest

          labels: |
            org.opencontainers.image.title=Balatro Multiplayer Server
            org.opencontainers.image.description=Balatro Multiplayer private server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.check-new-release.outputs.upstream_sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## Balatro Multiplayer Server"
            echo ""
            echo "Upstream commit: \`${{ needs.check-new-release.outputs.upstream_sha }}\`"
            echo ""
            echo "Published:"
            echo ""
            echo "- \`${{ needs.check-new-release.outputs.image }}:sha-${{ needs.check-new-release.outputs.upstream_short_sha }}\`"
            echo "- \`${{ needs.check-new-release.outputs.image }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"